name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Astro content validation
        run: pnpm check

      - name: Lint code
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Build first: tests/unit/static-build.test.ts reads the generated dist/ files.
      - name: Build production static site
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E & WCAG accessibility tests
        run: pnpm test:e2e
