<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Lake Mountain and Wasatch range singletrack illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="xcGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#sky)"/>
  <!-- Topographic contour arcs -->
  <g fill="none" stroke="#334155" stroke-width="1.5" opacity="0.55">
    <path d="M-50 220 Q 300 120 650 210 T 1250 160"/>
    <path d="M-50 270 Q 320 170 670 250 T 1250 210"/>
    <path d="M-50 320 Q 340 220 690 290 T 1250 260"/>
  </g>
  <!-- Distant Wasatch & Lake Mountain ridgelines -->
  <path d="M0 470 L180 310 L330 395 L520 230 L700 365 L890 255 L1060 350 L1200 280 L1200 720 L0 720 Z" fill="#132038"/>
  <path d="M0 540 L230 390 L430 470 L660 340 L870 445 L1080 375 L1200 430 L1200 720 L0 720 Z" fill="#0b1324"/>
  <!-- Flowing singletrack ribbon in XC Blue, Enduro Orange & Jr Green -->
  <path d="M660 342 C 590 410, 760 455, 610 525 C 470 590, 740 645, 520 720" fill="none" stroke="url(#xcGlow)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="940" cy="150" r="54" fill="#f97316" opacity="0.18"/>
  <circle cx="940" cy="150" r="28" fill="#fb923c" opacity="0.35"/>
</svg>
