question: Which program is right for my rider?
answer: Kids in grades K–6 start with Jr. Flyers in the summer (June–August), where they learn braking, shifting, and trail confidence through games and short rides. Riders in grades 7–12 who like longer rides, fitness, and cross-country racing join Flyers XC. Riders in grades 5–12 (ages 10–19) who love technical descents and bike parks join Flyers Enduro. Plenty of riders do both XC and Enduro, and none of the programs require racing.
