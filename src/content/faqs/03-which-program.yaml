question: Which program is right for my rider's age and experience level?
answer: Grades K–6 start in Jr. Flyers (June–August) to build trail confidence, braking/shifting, and fun fundamentals. Riders in 7th–12th grade (ages 13–19) who enjoy singletrack fitness, adventure rides, and cross-country racing join Flyers XC ($50). Riders ages 10–19 excited about technical descents, bike parks, and timed downhill stages join Flyers Enduro ($150). Many riders participate in both XC and Enduro!
