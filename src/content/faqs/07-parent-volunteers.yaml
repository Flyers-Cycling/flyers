question: Can parents volunteer?
answer: Yes, please. Parents are the heart of Flyers. You can sweep a Jr. Flyers group, help on XC rides or Enduro skills days, run the race-day tent, join a trail workday, or help with sponsors. You don't need to be a fast rider, and we'll show you what to do. Email info@lakemountainflyers.com to get started.
