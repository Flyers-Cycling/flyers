question: Can parents volunteer to ride, sweep, or coach with the club?
answer: Absolutely—parent involvement is the heartbeat of Flyers! Whether you want to sweep a Jr. Flyers K–6 pod, mentor technical lines with Enduro, lead XC climbs, help manage the race-day tent, or coordinate sponsors, we provide guidance and welcome every parent who wants to ride alongside our youth.
