question: Why are Flyers registration fees only $50 or $150 when other clubs cost thousands?
answer: Flyers Cycling Club (operated by Lake Mountain Bicycle Club, Inc., a 501(c)(3) non-profit) is 100% volunteer-led. Nobody collects a coaching salary. Your $50 (Jr. Flyers & Flyers XC) or $150 (Flyers Enduro) registration fee strictly covers your rider t-shirt and club insurance—community sponsors and tax-deductible donations fund everything else so cost never keeps a kid off the trail.
category: costs-nonprofit
order: 1
