question: What bike and gear does my child need?
answer: Every rider needs a trail-worthy bike with hand brakes and knobby tires, plus a CPSC-certified helmet. Jr. Flyers riders just need a properly sized two-wheel bike (no training wheels). Flyers XC riders usually ride a cross-country hardtail or a trail full-suspension bike. Flyers Enduro riders need a trail or enduro full-suspension bike with disc brakes, knee pads, eye protection, and a full-face helmet for gravity days. Each program page has a full gear checklist. Not sure if your bike is ready? Ask a coach before you buy anything.
category: gear-safety
order: 4
