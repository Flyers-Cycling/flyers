question: What kind of mountain bike and protective gear does my child need?
answer: Every rider needs a safe, trail-worthy bike with hand brakes, knobby tires, and a CPSC-certified cycling helmet. Flyers XC riders typically ride a cross-country hardtail or trail full-suspension bike. Flyers Enduro riders need a trail or enduro full-suspension bike with disc brakes, knee pads, eyewear/goggles, and a full-face helmet for gravity stages. Jr. Flyers K–6 riders just need a properly sized two-wheel bike (no training wheels) with working hand brakes.
