question: Are race entries and team kits included in registration?
answer: No. Race entry fees (for example ICUP or Utah Enduro Series events) and custom Volt Cyclewear jerseys are optional, and families pay for them only if they choose to. Racing is encouraged for riders who want it but is never required to ride with the club. Our jerseys are designed to go with plain black shorts or bibs, so you don't need to buy custom bottoms. Your rider will also need their own bike and gear, and you'll cover any travel to race venues.
