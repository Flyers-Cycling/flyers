question: Are race entry fees and team kits included in the $50 / $150 club fee?
answer: Optional race entry fees (such as ICUP or Utah Enduro Series events) and optional custom Volt Cyclewear jerseys are paid directly when families choose to participate. Racing is encouraged for riders who want competition, but never mandatory to ride with the club! Plus, our custom jerseys are intentionally designed to pair with standard black shorts/bibs so families don't have to buy expensive custom bottoms.
