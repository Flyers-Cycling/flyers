question: Are donations and sponsorships tax-deductible?
answer: Flyers Cycling Club is run by Lake Mountain Bicycle Club, Inc., a registered 501(c)(3) non-profit, so gifts are tax-deductible to the extent allowed by law. Every gift made through Zeffy or by check or ACH gets an official receipt. If your sponsorship includes benefits such as logo placement, check with your tax advisor about how that affects your deduction.
