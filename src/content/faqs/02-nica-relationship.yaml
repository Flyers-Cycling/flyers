question: Does Flyers replace my student's NICA high school or middle school mountain bike team?
answer: No—Flyers complements NICA! We actively partner with and support local NICA programs including Westlake, Lehi, Cedar Valley, Skyridge, and Lone Peak. Flyers XC and Flyers Enduro give athletes structured winter, spring, and summer riding (plus gravity/technical skills) outside the fall NICA season so riders return to their school teams fitter, safer, and faster.
