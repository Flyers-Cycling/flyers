question: Does Flyers replace my rider's school NICA team?
answer: No. Flyers is meant to go alongside your school team, not replace it. Flyers XC and Flyers Enduro ride in winter, spring, and summer, outside the fall NICA season, so riders head into school practice fitter and more confident. Many Flyers riders also race for local school teams such as Westlake, Lehi, Cedar Valley, Skyridge, and Lone Peak.
